
name: Deploy RH Global Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhglobal-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Create production environment file
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s' "$ENV_FILE" > "$RUNNER_TEMP/rhglobal.env"
          test -s "$RUNNER_TEMP/rhglobal.env"
          chmod 600 "$RUNNER_TEMP/rhglobal.env"

      - name: Upload environment file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "/home/runner/work/_temp/rhglobal.env"
          target: "/home/ubuntu/RHglobal-backend/"
          overwrite: true
          strip_components: 3
          timeout: 60s

      - name: Deploy backend on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -eu

            cd /home/ubuntu/RHglobal-backend

            echo "Checking uploaded environment file..."
            test -s /home/ubuntu/RHglobal-backend/rhglobal.env
            mv /home/ubuntu/RHglobal-backend/rhglobal.env /home/ubuntu/RHglobal-backend/.env
            chmod 600 /home/ubuntu/RHglobal-backend/.env

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Restarting backend..."
            if pm2 describe backend >/dev/null 2>&1; then
              pm2 restart backend --update-env
            else
              pm2 start npm --name backend -- start
            fi

            pm2 save

            echo "Deployment finished."
            pm2 status backend

