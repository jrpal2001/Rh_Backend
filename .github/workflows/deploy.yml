
name: Deploy RH Global Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhglobal-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production environment file
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail

          if [ -z "$ENV_FILE" ]; then
            echo "ERROR: GitHub secret ENV_FILE is empty or missing."
            exit 1
          fi

          printf '%s' "$ENV_FILE" > .env
          test -s .env

          # SCP runs in a container and must be able to read this file.
          chmod 644 .env

      - name: Upload environment file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: ".env"
          target: "/home/ubuntu/RHglobal-backend/"
          overwrite: true
          timeout: 60s

      - name: Deploy backend on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -eu

            cd /home/ubuntu/RHglobal-backend

            echo "Checking environment file..."
            if [ ! -s .env ]; then
              echo "ERROR: .env is missing or empty."
              exit 1
            fi

            echo "Setting environment file ownership and permissions..."
            sudo chown ubuntu:ubuntu .env
            chmod 600 .env

            echo "Updating repository..."
            git fetch origin main
            git reset --hard origin/main

            echo "Verifying environment file still exists..."
            test -s .env
            chmod 600 .env

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Restarting backend..."
            if pm2 describe backend >/dev/null 2>&1; then
              pm2 restart backend --update-env
            else
              pm2 start npm --name backend -- start
            fi

            echo "Saving PM2 process list..."
            pm2 save

            echo "Checking backend status..."
            pm2 status backend

            echo "Deployment completed successfully."
